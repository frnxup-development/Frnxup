<!doctype html>
<html lang="en">
<head>
  <script src="/js/theme.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1877f2">
  <title>Page Dashboard · Frnxup</title>
  <link rel="stylesheet" href="/Css/app.css">
  <link rel="stylesheet" href="/Pages/css/pages.css">
  <link rel="stylesheet" href="/Pages/css/facebook-pages.css?v=20261123-fb1">
</head>
<body class="fx-facebook-pages fx-page-owner">
  <div class="frnx-page-screen">
    <header class="frnx-page-toolbar">
      <a href="/Pages/index.html" aria-label="Back to Pages">‹</a>
      <strong id="page-toolbar-name">Page dashboard</strong>
      <button type="button" id="page-share-link" title="Copy page link" aria-label="Share Page">↗</button>
      <a href="/Pages/actions.html" id="page-more-actions" title="All Page actions" aria-label="More Page actions">•••</a>
    </header>

    <main class="frnx-page-content-wrap">
      <section class="frnx-page-profile-card" aria-label="Page profile">
        <div class="frnx-page-cover" id="page-cover">
          <img class="frnx-page-cover-image" id="page-cover-image" alt="Page cover" hidden>
          <div class="frnx-page-cover-controls">
            <button type="button" id="page-cover-edit" title="Change cover photo">📷 <span>Edit cover photo</span></button>
            <input type="file" id="page-cover-file" accept="image/*" hidden>
          </div>
        </div>
        <div class="frnx-page-identity-row">
          <div class="frnx-page-avatar-wrap" id="page-avatar-wrap">
            <div class="avatar-fallback" id="page-avatar-fallback">F</div>
            <input type="file" id="page-avatar-file" accept="image/*" hidden>
          </div>
          <div class="frnx-page-summary">
            <h1 id="page-name">Loading page…</h1>
            <div class="frnx-page-followers" id="page-follower-summary">— followers</div>
            <div class="frnx-page-category" id="page-category"></div>
            <p id="page-bio" class="frnx-page-about"></p>
          </div>
          <div class="frnx-page-owner-actions" aria-label="Page actions">
            <button class="pages-button primary" id="page-create-post" type="button">＋ Create post</button>
            <button class="pages-button secondary" id="page-share-public" type="button">↗ Share Page</button>
            <button class="pages-button secondary" id="page-view-followers" type="button">♙ Manage followers</button>
            <button class="pages-button secondary" id="page-switch-personal" type="button">↩ Personal profile</button>
          </div>
        </div>
        <nav class="frnx-page-tabs" id="page-content-tabs" aria-label="Page content">
          <a class="active" data-page-media-route="all" href="/Pages/all.html">All</a>
          <a data-page-media-route="photos" href="/Pages/photos.html">Photos</a>
          <a data-page-media-route="reels" href="/Pages/reels.html">Reels</a>
          <a data-page-media-route="mentions" href="/Pages/mentions.html">Mentions</a>
        </nav>
        <script>
          (() => {
            const id = new URLSearchParams(location.search).get('id');
            if (!id) return;
            const files = { all: 'all.html', photos: 'photos.html', reels: 'reels.html', mentions: 'mentions.html' };
            document.querySelectorAll('#page-content-tabs [data-page-media-route]').forEach(link => {
              const key = link.dataset.pageMediaRoute;
              link.href = `/Pages/${files[key] || files.all}?id=${encodeURIComponent(id)}`;
            });
            const media = document.getElementById('page-media-open');
            if (media) media.href = `/Pages/all.html?id=${encodeURIComponent(id)}`;
          })();
        </script>
      </section>

      <div class="frnx-page-content-layout">
        <aside class="frnx-page-sidebar">
          <section class="frnx-page-panel frnx-page-personal">
            <h2>About this Page</h2>
            <p id="page-location"></p>
            <p id="page-website"></p>
            <label class="frnx-page-privacy-toggle"><input type="checkbox" id="page-show-followers"> Show follower count publicly</label>
            <p class="pages-message" id="page-settings-message" role="status"></p>
            <div class="frnx-page-panel-actions">
              <button class="pages-button secondary" id="page-save-settings" type="button">Save settings</button>
              <button class="pages-button secondary" id="page-edit-details" type="button">Edit Page details</button>
              <button class="pages-button secondary" id="page-invite-friends" type="button">Invite friends</button>
            </div>
          </section>
          <section class="frnx-page-panel frnx-page-followers-panel" id="page-followers-panel" hidden>
            <h2>Page followers</h2>
            <div id="page-followers-list"><div class="pages-empty">Loading followers…</div></div>
          </section>
        </aside>
        <section class="frnx-page-main" aria-label="Page posts">
          <a class="frnx-page-media-open" id="page-media-open" href="/Pages/all.html" hidden>View all Page media</a>
          <div class="frnx-page-feed-heading"><h2>Posts</h2><span>Updates shared by this Page</span></div>
          <div class="frnx-page-feed" id="page-posts"><div class="pages-empty">Loading page posts…</div></div>
        </section>
      </div>
    </main>
  </div>

  <div class="pages-modal-backdrop" id="page-edit-modal">
    <form class="pages-modal" id="page-edit-form">
      <h2>Edit Page details</h2>
      <div class="pages-field"><label for="edit-page-name">Page name</label><input id="edit-page-name" maxlength="80" required></div>
      <div class="pages-field"><label for="edit-page-slug">Personalized Page link slug</label><input id="edit-page-slug" maxlength="40" pattern="[a-z0-9-]{3,40}" required></div>
      <div class="pages-field"><label for="edit-page-category">Category</label><input id="edit-page-category" maxlength="80"></div>
      <div class="pages-field"><label for="edit-page-about">Description</label><textarea id="edit-page-about" maxlength="3000"></textarea></div>
      <div class="pages-field"><label for="edit-page-location">Location</label><input id="edit-page-location" maxlength="120"></div>
      <div class="pages-field"><label for="edit-page-website">Website</label><input id="edit-page-website" maxlength="240" placeholder="https://example.com"></div>
      <p class="pages-message" id="page-edit-message" role="status"></p>
      <div class="pages-modal-actions"><button class="pages-button secondary" type="button" data-close-edit>Cancel</button><button class="pages-button primary" type="submit">Save changes</button></div>
    </form>
  </div>

  <div class="pages-modal-backdrop" id="page-post-modal">
    <form class="pages-modal" id="page-post-form">
      <h2>Create a Page post</h2>
      <div class="pages-field"><label for="page-post-text">What's happening?</label><textarea id="page-post-text" maxlength="5000" placeholder="Share an update with your followers"></textarea></div>
      <div class="pages-field"><label for="page-post-media">Add photos or video</label><input type="file" id="page-post-media" accept="image/*,video/*" multiple><small>Up to 20 photos, or one video.</small></div>
      <div id="page-post-preview" class="fx-upload-preview"></div>
      <p class="pages-message" id="page-post-message" role="status"></p>
      <div class="pages-modal-actions"><button class="pages-button secondary" type="button" data-close-post>Cancel</button><button class="pages-button primary" type="submit" id="page-post-submit">Publish</button></div>
    </form>
  </div>

  <div id="fx-toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/core.js"></script>
  <script src="../js/layout.js?v=20261125-header-routing-fix"></script>
  <script src="/js/media-tools.js"></script>
  <script src="/Pages/js/pages.js?v=20261123-facebook1"></script>
  <script src="/Pages/js/page-action-router.js?v=20261123-actions1"></script>
</body>
</html>
