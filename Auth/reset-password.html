<!doctype html>
<html lang="en">
<head>
<script src="../js/theme.js"></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../Css/app.css"><link rel="stylesheet" href="../Css/auth.css">
  <title>Reset password · Frnxup</title>
</head>
<body>
  <div data-frnxup-shell></div>
  <main class="page auth-page" style="max-width:560px">
    <div class="card auth-card">
      <div class="auth-badge">🔐</div>
      <h1>Reset your password</h1>
      <p class="muted">Choose a new password for your Frnxup account.</p>
      <p id="recovery-msg" class="status-line" aria-live="polite"></p>
      <div id="new-password-section" hidden>
        <div class="divider"></div>
        <div class="field"><label for="new-pass">New password (minimum 8 characters)</label><input id="new-pass" type="password" minlength="8" autocomplete="new-password"></div>
        <button id="save-pass" class="button primary full" type="button">Update password</button>
      </div>
      <a class="plain-link" href="/Auth/index.html">Back to log in</a>
    </div>
  </main>
  <div class="toast" id="fx-toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script><script src="../js/core.js"></script><script src="../js/layout.js"></script>
  <script>
  (() => {
    const $ = FX.qs;
    const message = (text, kind = 'info') => FX.setMessage('#recovery-msg', text, kind);
    document.addEventListener('DOMContentLoaded', async () => {
      if (!FX.client) { message('Supabase is not configured. Check js/config.js.', 'error'); return; }
      const user = await FX.loadUser();
      if (!user) { message('This password-reset link is missing or expired. Request a new reset link from the login page.', 'error'); return; }
      $('#new-password-section').hidden = false;
      message('Choose a new password for your account.');
      $('#save-pass').addEventListener('click', async () => {
        const value = $('#new-pass').value;
        if (value.length < 8) { message('Password must contain at least 8 characters.', 'error'); return; }
        const button = $('#save-pass');
        button.disabled = true;
        try {
          const { error } = await FX.client.auth.updateUser({ password: value });
          if (error) throw error;
          message('Password updated successfully.');
          setTimeout(() => location.replace('/index.html'), 800);
        } catch (error) {
          message(error.message || 'Unable to update password.', 'error');
          button.disabled = false;
        }
      });
    });
  })();
  </script>
</body>
</html>
