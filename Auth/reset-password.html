<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7fbfc">
  <meta name="description" content="Choose a new password for your Frnxup account.">
  <title>Reset password · Frnxup</title>
  <link rel="icon" href="../Asset/frnxup-mark.svg">
  <link rel="stylesheet" href="../Css/app.css">
  <link rel="stylesheet" href="../Css/auth.css">
</head>
<body class="auth-screen">
  <main class="auth-layout">
    <a class="auth-brand" href="/Auth/index.html" aria-label="Frnxup login">
      <img src="../Asset/frnxup-mark.svg" alt="Frnxup logo">
      <span class="auth-brand-name">Frnxup</span>
      <span class="auth-brand-tagline">CONNECT. EXPRESS. RISE.</span>
    </a>
    <section class="card auth-card">
      <div class="auth-heading">
        <span class="auth-eyebrow">SECURE ACCOUNT RECOVERY</span>
        <h1>Choose a new password</h1>
        <p>Use a new password that you do not use on another website.</p>
      </div>
      <p id="recovery-msg" class="status-line" aria-live="polite">Checking your secure reset link…</p>
      <form id="new-password-form" hidden novalidate>
        <div class="field">
          <label for="new-pass">New password (at least 8 characters)</label>
          <input id="new-pass" name="new-password" type="password" minlength="8" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="confirm-pass">Confirm new password</label>
          <input id="confirm-pass" name="confirm-password" type="password" minlength="8" autocomplete="new-password" required>
        </div>
        <button class="button primary full" id="save-pass" type="submit">Update password</button>
      </form>
      <a class="plain-link" id="request-new" href="/Auth/forgot-password.html" hidden>Request a new reset link</a>
      <a class="plain-link" href="/Auth/index.html">Back to log in</a>
    </section>
    <footer class="auth-footer">© <span id="year">2026</span> Frnxup. Connect. Express. Rise.</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/core.js"></script>
  <script>
  (() => {
    const message = document.getElementById('recovery-msg');
    const form = document.getElementById('new-password-form');
    const requestLink = document.getElementById('request-new');
    const saveButton = document.getElementById('save-pass');
    const query = new URLSearchParams(window.location.search);
    const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const tokenHash = query.get('token_hash');
    const tokenType = query.get('type');
    const hasLegacyRecoveryFragment = hash.get('type') === 'recovery' && hash.has('access_token');
    let recoveryVerified = false;
    let authSubscription = null;

    document.getElementById('year').textContent = new Date().getFullYear();
    const show = (text, kind = 'info') => {
      if (window.FX?.setMessage) FX.setMessage('#recovery-msg', text, kind);
      else { message.textContent = text; message.dataset.kind = kind; }
    };
    const revealForm = () => {
      recoveryVerified = true;
      form.hidden = false;
      requestLink.hidden = true;
      show('Your reset link is verified. Enter and confirm your new password.', 'success');
      // Remove the one-time token from the visible URL after successful verification.
      try { history.replaceState({}, document.title, window.location.pathname); } catch (_) {}
    };
    const expired = (text) => {
      form.hidden = true;
      requestLink.hidden = false;
      show(text || 'This reset link is missing, expired, or has already been used. Request a fresh reset link.', 'error');
    };

    async function initialise() {
      if (!window.FX?.client) {
        expired('Frnxup could not connect to its account service. Please try again later.');
        return;
      }

      // Listen before verifying so the PASSWORD_RECOVERY event cannot be missed.
      const listener = FX.client.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' && session?.user) revealForm();
      });
      authSubscription = listener?.data?.subscription || null;

      if (tokenHash) {
        if (tokenType !== 'recovery') {
          expired('This is not a valid password-recovery link. Request a new reset link.');
          return;
        }
        try {
          const { data, error } = await FX.client.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' });
          if (error) throw error;
          if (!data?.session || !data?.user) throw new Error('The recovery session could not be created.');
          revealForm();
          return;
        } catch (_) {
          expired('This reset link has expired or has already been used. Request a new reset link.');
          return;
        }
      }

      // Backward compatibility for links already sent using Supabase's default
      // ConfirmationURL flow. The recovery marker and a valid session are both required.
      const hasLegacyCode = query.has('code');
      const urlError = query.get('error_description') || query.get('error');
      if (urlError) {
        expired('This reset link is invalid or has expired. Request a new reset link.');
        return;
      }
      if (hasLegacyRecoveryFragment || hasLegacyCode) {
        try {
          const { data, error } = await FX.client.auth.getSession();
          if (error) throw error;
          if (data?.session?.user && (hasLegacyRecoveryFragment || recoveryVerified)) {
            revealForm();
            return;
          }
        } catch (_) { /* Show the recovery-specific error below. */ }
      }

      if (!recoveryVerified) {
        expired('This reset link is missing, expired, or has already been used. Request a fresh reset link.');
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!recoveryVerified) {
        expired('Verify a valid reset link before choosing a new password.');
        return;
      }
      const password = document.getElementById('new-pass').value;
      const confirmation = document.getElementById('confirm-pass').value;
      if (password.length < 8) {
        show('Your password must contain at least 8 characters.', 'error');
        return;
      }
      if (password !== confirmation) {
        show('The passwords do not match. Check both fields and try again.', 'error');
        document.getElementById('confirm-pass').focus();
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = 'Updating…';
      try {
        const { error } = await FX.client.auth.updateUser({ password });
        if (error) throw error;
        show('Your password has been changed successfully. Returning you to login…', 'success');
        form.hidden = true;
        if (authSubscription) authSubscription.unsubscribe();
        try { await FX.client.auth.signOut({ scope: 'local' }); } catch (_) { /* Password is already updated. */ }
        setTimeout(() => window.location.replace('/Auth/index.html?passwordUpdated=1'), 1200);
      } catch (error) {
        show(error?.message || 'We could not update your password. Request a new reset link and try again.', 'error');
        saveButton.disabled = false;
        saveButton.textContent = 'Update password';
      }
    });

    initialise();
  })();
  </script>
</body>
</html>
