<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7fbfc">
  <meta name="description" content="Log in to your Frnxup account.">
  <title>Log in · Frnxup</title>
  <link rel="icon" href="../Asset/frnxup-mark.svg">
  <link rel="stylesheet" href="../Css/app.css">
  <link rel="stylesheet" href="../Css/auth.css">
<link rel="stylesheet" href="../Css/frnxup-wordmark.css?v=20261125-option7"></head>
<body class="auth-screen">
  <main class="auth-layout">
    <a class="auth-brand" href="/Auth/index.html" aria-label="Frnxup login">
      <img src="../Asset/frnxup-mark.svg" alt="Frnxup logo">
      <span class="auth-brand-name"><span class="frnxup-wordmark-text" role="img" aria-label="FRNXUP"><span class="frnxup-navy">FRN</span><span class="frnxup-x">X</span><span class="frnxup-navy">UP</span></span></span>
      <span class="auth-brand-tagline">CONNECT. EXPRESS. RISE.</span>
    </a>
    <div class="card auth-card">
      <div class="auth-heading">
        <span class="auth-eyebrow">WELCOME BACK</span>
        <h1>Log in to Frnxup</h1>
        <p>Sign in with your registered email address or username.</p>
      </div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="identity">Email or username</label>
          <input id="identity" name="identity" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="you@example.com or @username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Your password" required>
        </div>
        <div class="auth-remember">
          <label for="remember-device">
            <input type="checkbox" id="remember-device" name="remember-device">
            <span><strong>Remember this device</strong><small>Stay signed in on this browser. Your password is never saved.</small></span>
          </label>
        </div>
        <button class="button primary full auth-submit" id="login" type="submit">Log in securely</button>
        <p id="login-msg" class="status-line" aria-live="polite"></p>
      </form>
      <a class="plain-link auth-forgot" href="/Auth/forgot-password.html">Forgot password?</a>
      <div class="auth-switch">
        <span>Don't have a Frnxup account?</span>
        <a id="switch-to-signup" href="signup.html">Create an account</a>
      </div>
      <div class="auth-security-note">
        <span class="auth-security-icon" aria-hidden="true">✓</span>
        Frnxup checks account status before opening a member session.
      </div>
    </div>
    <footer class="auth-footer">© <span id="auth-year">2026</span> Frnxup. Connect. Express. Rise.</footer>
  </main>
  <div class="toast" id="fx-toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/core.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.getElementById('auth-year').textContent = new Date().getFullYear();
    if (new URLSearchParams(location.search).get('passwordUpdated') === '1' && window.FX?.setMessage) {
      FX.setMessage('#login-msg', 'Your password has been changed. Sign in with your new password.', 'success');
    }
  </script>
</body>
</html>
