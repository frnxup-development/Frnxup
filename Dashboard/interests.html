<!doctype html><html><head>
<script>
(() => {
  const path = location.pathname;
  const publicEntry = path === '/Auth' || path.startsWith('/Auth/') || path === '/Admin' || path.startsWith('/Admin/');
  if (publicEntry) return;
  document.documentElement.classList.add('fx-auth-pending');
  const style = document.createElement('style');
  style.textContent = `html.fx-auth-pending,html.fx-auth-pending body{background:#f7fbfc!important}html.fx-auth-pending body{visibility:hidden!important}html.fx-auth-pending::before{content:'Checking your Frnxup session…';position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#f7fbfc;color:#42616c;font:600 14px system-ui,sans-serif}`;
  document.head.appendChild(style);
})();
</script>
