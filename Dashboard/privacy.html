<script src="../js/theme.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Privacy · Frnxup</title><link rel="stylesheet" href="../Css/app.css"></head><body><div data-frnxup-shell></div><main class="page" style="max-width:780px"><div class="page-heading"><div><h1>Privacy controls</h1><p>You decide who can see your profile and contact you.</p></div><a class="button subtle" href="index.html">Dashboard</a></div><form class="card" id="privacy-form" style="padding:20px"><div class="field"><label>Profile visibility</label><select id="profile-visibility"><option value="public">Everyone</option><option value="friends">Friends only</option><option value="private">Only me</option></select></div><div class="field"><label>Who can see your friends list?</label><select id="friends-visibility"><option value="public">Everyone</option><option value="friends">Friends only</option><option value="private">Only me</option></select></div><div class="field"><label>Who can see your education, age and interests?</label><select id="details-visibility"><option value="public">Everyone</option><option value="friends">Friends only</option><option value="private">Only me</option></select></div><div class="field"><label>Who can send friend requests?</label><select id="friend-policy"><option value="everyone">Everyone</option><option value="friends_of_friends">Friends of friends</option><option value="none">No one</option></select></div><div class="field"><label>Who can message you?</label><select id="message-policy"><option value="everyone">Everyone</option><option value="friends">Friends only</option></select></div><div class="field"><label>Online status</label><select id="online-visibility"><option value="friends">Friends only</option><option value="everyone">Everyone</option><option value="nobody">Nobody</option></select></div><button class="button primary">Save privacy settings</button><p id="privacy-msg" class="status-line"></p></form></main><div id="fx-toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/core.js"></script><script src="../js/layout.js"></script><script src="../js/dashboard.js"></script></body></html>
