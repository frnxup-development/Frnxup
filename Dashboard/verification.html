<!doctype html><html><head>
<script src="../js/theme.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verification request · Frnxup</title><link rel="stylesheet" href="../Css/app.css"></head><body><div data-frnxup-shell></div><main class="page" style="max-width:700px"><div class="page-heading"><div><h1>Request verification</h1><p>Submit a request for the Frnxup team to review.</p></div><a class="button subtle" href="index.html">Dashboard</a></div><form id="verification-form" class="card" style="padding:20px"><div class="field"><label>Why should your account be verified?</label><textarea id="verification-note" maxlength="2000" required></textarea></div><div class="field"><label>Supporting evidence (optional)</label><input id="verification-file" type="file" accept="image/*,.pdf"></div><button class="button primary">Submit verification request</button><p id="verification-msg" class="status-line"></p></form><div class="card" style="padding:17px;margin-top:14px"><h3>Your requests</h3><div id="verification-history"></div></div></main><div id="fx-toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/core.js"></script><script src="../js/layout.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{await FX.loadUser();if(!FX.user){FX.showAuthNotice('Sign in to submit or review a verification request.');return;}async function load(){const {data,error}=await FX.client.from('verification_requests').select('id,status,note,created_at').eq('user_id',FX.user.id).order('created_at',{ascending:false});document.querySelector('#verification-history').innerHTML=error?FX.esc(error.message):(data||[]).map(v=>`<div class="row-card"><div class="grow"><b>${FX.esc(v.status)}</b><small>${FX.esc(v.note)} · ${FX.time(v.created_at)}</small></div></div>`).join('')||'<div class="empty">No verification requests yet.</div>'}load();document.querySelector('#verification-form').onsubmit=async e=>{e.preventDefault();let path=null;const f=document.querySelector('#verification-file').files[0];try{if(f)path=await FX.upload(f,'verification');const {error}=await FX.client.from('verification_requests').insert({user_id:FX.user.id,note:document.querySelector('#verification-note').value.trim(),evidence_path:path});if(error)throw error;FX.setMessage('#verification-msg','Request submitted for review.');e.target.reset();load()}catch(err){FX.setMessage('#verification-msg',err.message)}}})</script><script src="/js/media-tools.js"></script></body></html>
