<!doctype html>
<html lang="en">
<head>
<script src="../js/theme.js"></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Security · Frnxup</title><link rel="stylesheet" href="../Css/app.css">
</head>
<body>
  <div data-frnxup-shell></div>
  <main class="page" style="max-width:780px">
    <div class="page-heading"><div><h1>Account security</h1><p>Protect your account and control your sessions.</p></div><a class="button subtle" href="index.html">Dashboard</a></div>
    <section class="card" style="padding:20px">
      <h3>Change password</h3>
      <div class="field"><label for="new-password">New password (minimum 8 characters)</label><input type="password" id="new-password" minlength="8" autocomplete="new-password"></div>
      <button class="button primary" id="change-password" type="button">Update password</button>
      <div class="divider"></div>
      <h3>Sessions</h3><p class="muted" style="font-size:11px">You can sign out this browser or all active devices.</p>
      <button class="button danger" id="signout-all" type="button">Sign out all sessions</button>
      <div class="divider"></div>
      <h3>Account controls</h3><p class="muted" style="font-size:11px">Permanent account deletion requires a confirmation flow and may be irreversible.</p>
      <button class="button danger" id="delete-account" type="button">Delete my account</button>
      <p id="security-msg" class="status-line" aria-live="polite"></p>
    </section>
  </main>
  <div id="fx-toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script><script src="../js/core.js"></script><script src="../js/layout.js"></script><script src="../js/dashboard.js"></script>
</body>
</html>
