<!doctype html>
<html lang="en">
<head>
  <script src="../js/theme.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080d17">
  <meta name="description" content="View and discuss this post on Frnxup — connect, express and rise.">
  <meta property="og:site_name" content="Frnxup">
  <meta property="og:title" content="A post on Frnxup">
  <meta property="og:description" content="Open this post on Frnxup to view it and join the conversation.">
  <title>Post · Frnxup</title>
  <link rel="stylesheet" href="../Css/app.css">
  <link rel="stylesheet" href="../Css/comments.css">
</head>
<body>
  <div data-frnxup-shell></div>
  <main class="page" style="max-width:820px">
    <a class="fx-back-link" href="/index.html">‹ Back to Frnxup</a>
    <div id="post-detail"><div class="empty">Loading the shared post…</div></div>
    <section class="card fx-comments-sheet" aria-label="Post comments">
      <div class="fx-comments-handle"><button id="close-comments-sheet" type="button" aria-label="Close comments"><span></span></button></div>
      <div class="fx-comments-heading"><div><h2>Comments</h2><small id="comment-count" class="muted"></small></div><span class="fx-comments-sort">All comments</span></div>
      <div id="comments-list" class="comments-list"><div class="empty">Comments will appear here.</div></div>
      <div id="comment-composer" class="fx-comment-composer">
        <div id="reply-context" class="reply-context" hidden></div>
        <div class="fx-comment-compose-row"><span class="fx-compose-avatar">F</span><textarea id="comment-body" maxlength="2000" placeholder="Write a comment…" rows="1" aria-label="Write a comment"></textarea><button class="fx-comment-send" id="send-comment" type="button" aria-label="Send comment">➤</button></div>
      </div>
    </section>
  </main>
  <div id="fx-toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/core.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/media-tools.js"></script>
  <script src="../js/post-actions.js"></script>
  <script src="../js/post-view.js"></script>
</body>
</html>
