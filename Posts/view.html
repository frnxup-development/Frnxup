<!doctype html>
<html lang="en">
<head>
  <script src="../js/theme.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080d17">
  <meta name="description" content="View and discuss this post on Frnxup — connect, express and rise.">
  <meta property="og:site_name" content="Frnxup">
  <meta property="og:title" content="A post on Frnxup">
  <meta property="og:description" content="Open this post on Frnxup to view it and join the conversation.">
  <title>Post · Frnxup</title>
  <link rel="stylesheet" href="../Css/app.css">
</head>
<body>
  <div data-frnxup-shell></div>
  <main class="page" style="max-width:820px">
    <a class="fx-back-link" href="/index.html">‹ Back to Frnxup</a>
    <div id="post-detail"><div class="empty">Loading the shared post…</div></div>
    <section class="card" style="padding:16px;margin-top:16px">
      <div class="panel-head"><h2 style="font:800 19px Manrope;margin:0">Comments</h2><small id="comment-count" class="muted"></small></div>
      <div class="field" style="margin-top:13px"><textarea id="comment-body" maxlength="3000" placeholder="Write a comment…" rows="3"></textarea></div>
      <div id="reply-context" hidden></div>
      <div style="display:flex;justify-content:flex-end"><button class="button primary" id="send-comment" type="button">Comment</button></div>
      <div id="comments-list" class="comments-list" style="margin-top:16px"><div class="empty">Comments will appear here.</div></div>
    </section>
  </main>
  <div id="fx-toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/core.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/media-tools.js"></script>
  <script src="../js/post-actions.js"></script>
  <script src="../js/post-view.js"></script>
</body>
</html>
